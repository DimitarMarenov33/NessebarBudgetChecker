name: Deploy site

# Rebuilds and redeploys the static site on its own, without touching any
# scraper: for when a push to main changes the site generator or templates
# (src/nessebar_budget/web/**) or the committed data (data/nessebar.db, via
# weekly.yml's bot commit, or a manual DB update). Also available on demand.
on:
  push:
    branches: [main]
    paths:
      - "src/nessebar_budget/web/**"
      - "data/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The weekly pipeline's own "data: weekly update ..." commit already
    # builds and deploys the site itself (see weekly.yml); its commit
    # message also carries "[skip ci]", which keeps GitHub from running any
    # push-triggered workflow (including this one) for it. This `if` is a
    # second, explicit guard against that same loop (bot push -> this
    # workflow -> ... ), in case the commit message guard is ever changed.
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build static site
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://dimitarmarenov33.github.io/NessebarBudgetChecker' }}
        run: python -m nessebar_budget.cli build-site --out site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      # Shared with weekly.yml's deploy job so two workflows never deploy to
      # GitHub Pages at the same time.
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
